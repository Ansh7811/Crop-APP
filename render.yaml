databases:
  - name: agro-db
    databaseName: agro_intelligence
    plan: free

services:
  - type: web
    name: agro-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agro-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0
